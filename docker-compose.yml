version: "3.9"

services:
  # ─── PostgreSQL (Production Database) ─────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: qsense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qsense
      POSTGRES_PASSWORD: qsense_secret
      POSTGRES_DB: qsense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qsense_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: "replace-in-production-with-256-bit-random-key"
      DATABASE_URL: "postgresql+asyncpg://qsense:qsense_secret@db:5432/qsense"
      DATABASE_SYNC_URL: "postgresql://qsense:qsense_secret@db:5432/qsense"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:80"]'
      MODEL_DIR: "/app/ml/models"
      DATASETS_DIR: "/app/ml/data/datasets"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml:/app/ml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qsense_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
